name: Release capability contract

on:
  push:
    tags:
      - "capability-contract-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install workspace
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          version="$(node -p "require('./packages/capability-contract/package.json').version")"
          test "${GITHUB_REF_NAME}" = "capability-contract-v${version}"

      - name: Audit, test, and build
        run: |
          npm run audit:repo
          npm test
          npm run build:adapters

      - name: Build immutable package artifact
        run: npm run smoke:contract

      - name: Verify artifact traces to a clean source commit
        run: |
          node --input-type=module -e "import { readdir, readFile } from 'node:fs/promises'; const [name] = (await readdir('./dist/packages')).filter((entry) => entry.endsWith('.metadata.json')); if (!name) process.exit(1); const m = JSON.parse(await readFile('./dist/packages/' + name, 'utf8')); if (m.sourceDirty || m.sourceCommit !== process.env.GITHUB_SHA) process.exit(1)"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/packages/*.tgz \
            dist/packages/*.sha256 \
            dist/packages/*.metadata.json \
            --title "@taku/capability-contract ${GITHUB_REF_NAME#capability-contract-v}" \
            --notes "Immutable Taku Passport Capability Contract artifact. See the attached SHA-256 checksum before consuming."
